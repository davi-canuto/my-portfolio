<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Janela -->
  <rect width="32" height="26" x="0" y="3" fill="#111" rx="4"/>
  <!-- Barra do topo -->
  <rect width="32" height="8" x="0" y="3" fill="#1e1e1e" rx="4"/>
  <rect width="32" height="4" x="0" y="7" fill="#1e1e1e"/>
  <!-- Três dots no topo direito -->
  <circle cx="21" cy="7" r="1.8" fill="#eee"/>
  <circle cx="25.5" cy="7" r="1.8" fill="#eee"/>
  <circle cx="30" cy="7" r="1.8" fill="#eee"/>
  <!-- Seta > -->
  <polyline points="8,16 13,20 8,24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor retangular -->
  <rect x="15" y="22" width="8" height="3" rx="1.5" fill="#fff"/>
